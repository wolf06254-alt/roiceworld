# Конфиг для деплоя на Render как Static Site
# Подключи репозиторий с этими файлами → Render подхватит настройки автоматически.
services:
  - type: web
    name: roiceworld
    runtime: static
    # Сайт лежит в корне репозитория
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
